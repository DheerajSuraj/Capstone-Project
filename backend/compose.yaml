# Local development database. Start it with `docker compose up -d` in this
# folder before starting the backend (application.yml points at port 5433).
#
# Postgres 16 is pinned deliberately: it matches the version we will run in
# production on the Oracle VM (roadmap §13.2). Dev/prod parity > novelty.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tsb-postgres
    environment:
      POSTGRES_DB: tsb
      POSTGRES_USER: tsb
      POSTGRES_PASSWORD: tsb_dev_only   # dev-only credential; prod uses env vars
    ports:
      # host 5433 -> container 5432 (native Postgres owns host 5432). Bound to
      # 127.0.0.1 so only this computer can reach it: with a published port
      # on all addresses, anyone on the same Wi-Fi could log in with the
      # dev password below.
      - "127.0.0.1:5433:5432"
    volumes:
      - tsb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsb -d tsb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tsb_pgdata: